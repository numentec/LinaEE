  #     - VALIDATION=dns
  #     - DNSPLUGIN=hetzner
  #   volumes:
  #     - /home/numen/swag:/config
  #     - /home/numen/www/html:/var/www/html
  #     - ./linabe/static:/static
  #     - ./linabe/media:/media
  #   networks:
  #     net:
