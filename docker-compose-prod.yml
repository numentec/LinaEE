version: '3'

services:
  # MariaDB service for LinaEE
  linadb:
    image: linuxserver/mariadb:10.5.17
    container_name: linadb
    environment:
      - PUID=1000
      - PGID=1000
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PW}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_USER_PW}
      - TZ=${LOC_TZ}
    volumes:
      - dbdata:/var/lib/mysql/data
      - /home/numen/linadb:/config
    networks:
      net:
        ipv4_address: 192.168.15.5
    ports:
        - 3305:3306
    restart: unless-stopped


  # Django backend service
  be:
    image: galvanino/linabe:0.0.2
    container_name: linabe
    env_file:
      - ./.env
    volumes:
      - ./linabe:/linabe
    networks:
      net:
        ipv4_address: 192.168.15.4
    ports:
      - 8001:8001
    command: ['./be.sh']
    stop_signal: SIGINT
    depends_on:
      - linadb
    restart: unless-stopped

  # Nuxt frontend service
  fe:
    image: galvanino/linafe:0.0.2
    container_name: linafe
    environment:
      HOST: 0.0.0.0
      PORT: 3005
      TZ: ${LOC_TZ}
      NODE_OPTIONS: --max_old_space_size=8048
      NODE_ENV: production
    volumes:
      - ./linafe:/linafe
      - linafe_node_modules:/linafe/node_modules
    networks:
      net:
        ipv4_address: 192.168.15.3
    ports:
      - 3005:3005
    command: ['./fe.sh']
    depends_on:
      - be
    restart: unless-stopped


  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    networks:
      net:
        ipv4_address: 192.168.15.6


  celery_worker:
    image: galvanino/linabe:0.0.2
    container_name: celeryworker
    command: /start-celeryworker
    networks:
      net:
        ipv4_address: 192.168.15.7
    volumes:
      - ./linabe:/linabe
    env_file:
      - ./.env
    depends_on:
      - redis
      - linadb

  flower:
    image: galvanino/linabe:0.0.2
    container_name: celeryflower
    command: /start-flower
    volumes:
      - ./linabe:/linabe
    env_file:
      - ./.env
    ports:
      - 5557:5555
    depends_on:
      - redis
      - linadb
    networks:
      net:
        ipv4_address: 192.168.15.8


  # # Proxies requests to internal services Nginx Reverse Proxy
  # swag:
  #   image: ghcr.io/linuxserver/swag
