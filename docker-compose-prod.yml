  #   depends_on:
  #       - be
  #       - fe
  #   restart: unless-stopped

volumes:
  dbdata:
  linafe_node_modules:

networks:
  net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.15.0/28
